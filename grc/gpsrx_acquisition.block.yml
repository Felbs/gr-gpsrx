id: gpsrx_acquisition
label: GPS Acquisition
category: '[gpsrx]'
flags: [python]
documentation: 'Complex baseband in (L1 C/A at any rate; 2.048 MS/s is the tested one). Finds the satellites.

  Every Interval seconds it copies a snapshot and searches it on its own thread: parallel

  code-phase search, 1 ms coherent x N non-coherent, over +-7 kHz of Doppler in 250 Hz bins,

  then refines each Doppler to ~10 Hz. Publishes what it found on ''sky'' and assigns each new

  satellite to a free Channel slot on ''assign'' (connect it to every Channel''s ''assign''; a

  Channel only acts on its own slot). Connect every Channel''s ''status'' back to ''status'' so

  the slot table knows which are busy.

  Threshold: peak over second peak; 2.5 with 100 ms separates real satellites (>3) from

  noise (<1.8), measured on air. LO offset search: a cheap crystal (RTL-SDR, ~30 ppm) puts

  the whole sky up to +-47 kHz off; one wide coarse pass finds it and every search is centred there.

  Hold: for file replay only - stops the stream while a

  search runs, otherwise a file source races past an idle receiver.'
templates: {imports: from gnuradio import gpsrx, make: 'gpsrx.acquisition(samp_rate=${samp_rate}, n_slots=${n_slots},
    snapshot_ms=${snapshot_ms}, interval_s=${interval_s}, threshold=${threshold}, n_noncoh=${n_noncoh},
    hold=${hold}, settle_s=${settle_s}, lo_search_hz=${lo_search_hz}, system=${system}, slot0=${slot0})'}
parameters:
- {id: samp_rate, label: Sample rate, dtype: real, default: samp_rate}
- id: system
  label: System
  dtype: enum
  default: '''GPS'''
  options: ['''GPS''', '''GAL''']
  option_labels: [GPS L1 C/A, Galileo E1-B (>= 4 MS/s)]
- {id: slot0, label: First slot, dtype: int, default: '0'}
- {id: n_slots, label: Channel slots, dtype: int, default: '8'}
- {id: interval_s, label: Interval (s), dtype: real, default: '20.0'}
- {id: threshold, label: Threshold, dtype: real, default: '2.5'}
- {id: n_noncoh, label: Non-coherent ms, dtype: int, default: '100', hide: part}
- {id: snapshot_ms, label: Snapshot (ms), dtype: int, default: '110', hide: part}
- {id: settle_s, label: First search after (s), dtype: real, default: '0.5', hide: part}
- {id: lo_search_hz, label: 'LO offset search (+-Hz; 50000 for an RTL-SDR, 0 = off)', dtype: real, default: '0.0'}
- id: hold
  label: Hold the stream while searching
  dtype: enum
  default: 'False'
  options: ['False', 'True']
  option_labels: [No (radio), Yes (file replay)]
inputs:
- {domain: stream, dtype: complex}
- {domain: message, id: status, optional: true}
outputs:
- {domain: message, id: sky, optional: true}
- {domain: message, id: assign}
file_format: 1
